<title>صهيل — للخيول العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root{
  --bg:#F7F3EA; --card:#FFFFFF; --card2:#FBF7EF; --ink:#1B2233; --ink2:#3A4152; --muted:#646A76; --line:#E6DCC8;
  --accent:#1F3A5F; --accent-d:#14284A; --on-acc:#FFFFFF; --gold:#F1E4C4; --gold-ink:#6B4E14; --price:#8A6A24;
  --ph:#ECE4D4; --ok-bg:#E3F0E4; --ok:#24552E; --red:#B4261A; --seg:#EAE2D2; --dash:#CDBB98;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'Almarai',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
:focus-visible{outline:3px solid #C9A055;outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top .btn,.top .btn.outline{background:transparent;color:#E8D7A8;border-color:#8A6A24}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{position:relative;display:inline-block;padding-bottom:26px;font-family:'Reem Kufi',serif;font-size:30px;font-weight:700;color:#C9A055;line-height:1.05;text-decoration:none}
.logo small{position:absolute;top:calc(100% - 22px);right:78%;font-family:'Almarai',sans-serif;font-size:12px;font-weight:600;color:#B9AE97;white-space:nowrap;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-acc)}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--red);border-color:#E9C3BE}
.btn.sm{height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.6}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted);margin-top:6px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;padding:0}
.chip{flex:none;height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-acc);font-weight:600}
.soon{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.soon a{text-decoration:none}
.soon button,.soon a{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-align:right;cursor:pointer}
.soon small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.h1{font-size:24px;font-weight:700;margin:6px 0 16px}
.h2{font-size:18px;font-weight:700;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink)}
.ph{position:relative;aspect-ratio:4/3;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;white-space:nowrap}
.ph .badge{position:absolute;top:8px;right:8px}
.badge.sold{background:var(--ink);color:var(--bg)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.cb b{font-size:16px}
.meta{font-size:12px;color:var(--muted)}
.price{font-size:14px;font-weight:700;color:var(--price);margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:44px 10px;font-size:14px;line-height:1.8}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.hero{position:relative;margin:0 -16px 16px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--ph);scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center}
.hero .ph{aspect-ratio:4/3}
.fab{position:absolute;top:12px;width:44px;height:44px;border-radius:22px;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;box-shadow:0 1px 3px rgba(42,26,16,.18)}
.fab.r{right:16px}.fab.l{left:16px}
.pcount{position:absolute;bottom:12px;left:16px;background:rgba(42,26,16,.7);color:#fff;font-size:12px;padding:5px 10px;border-radius:12px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hd h1{margin:0;font-size:28px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:15px;background:var(--card);border:1px solid var(--line);font-size:13px}
.loc{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:16px}
.pricebox{display:flex;flex-direction:column;gap:2px}

function renderAuth(){
  document.getElementById('authBox').innerHTML = user
    ? `<button class="btn sm" data-act="logout">خروج</button>`
    : `<button class="btn sm outline" data-act="login">دخول</button>`;
}
getRedirectResult(auth).catch(e => { console.error(e); if(e && e.code) toast('تعذّر الدخول (' + e.code + ')'); });
onAuthStateChanged(auth, u => { user = u; renderAuth(); route(); });

window.addEventListener('hashchange', route);
function route(){
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  const page = parts[0] || 'home';
  document.querySelectorAll('nav.bottom a').forEach(a => a.classList.toggle('on', a.dataset.nav === page));
  window.scrollTo(0, 0);
  cleanup();
  document.querySelectorAll('nav.bottom a').forEach(a => a.classList.toggle('on', a.dataset.nav === (page === 'auction' ? 'auctions' : page)));
  if(page === 'auctions') return viewAuctions();
  if(page === 'auction') return viewAuction(parts[1]);
  if(page === 'auction-new') return viewAuctionNew(parts[1]);
  if(page === 'bank') return viewBank();
  if(page === 'services') return viewServices();
  if(page === 'service') return parts[1] === 'edit' ? viewProviderEdit() : viewProvider(parts[1]);
  if(page === 'requests') return viewRequests();
  if(page === 'horse') return viewHorse(parts[1]);
  if(page === 'add') return viewAdd(parts[1]);
  if(page === 'mine') return viewMine();
  if(page === 'stable') return parts[1] === 'edit' ? viewStableEdit() : viewStable(parts[1]);
  return viewHome();
}

function renderGrid(){
  const g = document.getElementById('grid'); if(!g || !horsesCache) return;
  const q = filter.q;
  const list = horsesCache
    .filter(h => filter.cat === 'الكل' || h.category === filter.cat)
    .filter(h => !q || [h.name,h.city,h.sire,h.dam,h.category].some(v => (v||'').includes(q)))
    .sort((a,b) => (b.verified?1:0) - (a.verified?1:0));
  g.innerHTML = list.length ? list.map(card).join('')
    : `<div class="empty" style="grid-column:1/-1">لا توجد خيول بهذا البحث.<br><br><a class="btn primary" href="#/add">أضف إعلانك</a></div>`;
}
function card(h){
  const meta = [h.category, h.sex, ageText(h)].filter(Boolean).join('، ');
  return `<a class="card" href="#/horse/${h.id}">
    <div class="ph">${h.thumb ? `<img src="${h.thumb}" alt="" loading="lazy">` : 'لا توجد صورة'}
      ${h.status === 'sold' ? '<span class="badge sold">مباع</span>' : h.verified ? `<span class="badge">${I.check}موثّق</span>` : ''}</div>
    <div class="cb"><b>${esc(h.name)}</b><span class="meta">${esc(meta)}</span>
      <span class="meta">${esc(h.city)}</span><span class="price">${priceText(h)}</span></div></a>`;
}

    h = { id, ...s.data() };
    const [p, c, st] = await Promise.all([
      getDoc(doc(db,'horsePhotos',id)),
      user ? getDoc(doc(db,'contacts',id)) : Promise.resolve(null),

  app.innerHTML = `

    <button class="fab l" data-act="share" aria-label="مشاركة">${I.share}</button>

  <div class="tags">${[h.category, h.sex, ageText(h), h.color].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>

    ${h.method === 'offers' ? '<span class="meta">تواصل مع البائع لتقديم سومك</span>' : ''}</div>

  ${isUrl(h.videoUrl) ? `<a class="btn block" style="margin-bottom:14px" href="${esc(h.videoUrl)}" target="_blank" rel="noopener">${I.video}شاهد فيديو الخيل</a>` : ''}

  <div class="ped">

    <div class="col"><div class="main f"><span>الأم</span><b>${pv(h.dam)}</b></div>

/* ============ إضافة / تعديل إعلان ============ */
async function viewAdd(id){
  if(!user){ app.innerHTML = loginPrompt('سجّل الدخول لإضافة إعلان خيل.'); return; }
  if(id){
    if(editingId !== id){
      app.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
      try{
        const [s,p,c] = await Promise.all([getDoc(doc(db,'horses',id)), getDoc(doc(db,'horsePhotos',id)), getDoc(doc(db,'contacts',id))]);
        if(!s.exists() || (s.data().ownerUid !== user.uid && !isAdmin())){ app.innerHTML = '<div class="empty">لا يمكنك تعديل هذا الإعلان.</div>'; return; }
        const h = s.data();
        draft = { ...emptyDraft(), ...h,
          birthYear: h.birthYear ? String(h.birthYear) : '', price: h.price != null ? String(h.price) : '',
          photos: p.exists() ? (p.data().photos || []) : [],
          phone: c.exists() ? c.data().phone : '', whatsapp: c.exists() ? c.data().whatsapp : '' };
        editingId = id; step = 1;
      }catch(e){ console.error(e); app.innerHTML = '<div class="empty">تعذّر تحميل الإعلان للتعديل.</div>'; return; }
    }
  }else if(editingId || !draft){
    draft = emptyDraft(); editingId = null; step = 1;
  }
  renderStep();
}

function collect(){
  app.querySelectorAll('[data-f]').forEach(el => { draft[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
}
const opt = (list, val) => list.map(v => `<option ${v === val ? 'selected' : ''}>${esc(v)}</option>`).join('');
const field = (label, f, ph, extra='') => `<label class="f">${label}<input class="in" data-f="${f}" value="${esc(draft[f])}" placeholder="${ph}" ${extra}></label>`;

function renderStep(){
  const d = draft;
  const labels = ['البيانات','الصور','النسب','السعر'];
  let body = '';
  if(step === 1){
    body = `

async function onFiles(e){
  collect();
  const files = [...e.target.files];
  const room = MAX_PHOTOS - draft.photos.length;
  if(room <= 0){ toast(`الحد الأقصى ${ar(MAX_PHOTOS)} صور`); return; }
  if(files.length > room) toast(`أُضيفت أول ${ar(room)} صور فقط`);
  else toast('جارٍ تجهيز الصور…');
  for(const f of files.slice(0, room)){
    try{ const url = URL.createObjectURL(f); draft.photos.push(await resize(url, 900, 0.65)); URL.revokeObjectURL(url); }
    catch(err){ toast('تعذّرت قراءة إحدى الصور، جرّب صورة بصيغة JPG'); }
  }
  renderStep();
}

function validate(s){
  const d = draft;
  if(s === 1){
    if(!d.name) return 'اكتب اسم الخيل';
    if(!d.city) return 'اختر المدينة';
    if(d.birthYear){ const y = Number(digits(d.birthYear)); if(y < 1990 || y > new Date().getFullYear()) return 'سنة الميلاد غير صحيحة'; }
  }
  if(s === 2){
    if(!d.photos.length) return 'أضف صورة واحدة على الأقل';
    if(d.videoUrl && !isUrl(d.videoUrl)) return 'رابط الفيديو يجب أن يبدأ بـ https://';
  }
  if(s === 4){
    if(d.method === 'fixed' && !Number(digits(d.price))) return 'اكتب السعر أو اختر «على السوم»';
    if(digits(d.phone).length < 9) return 'اكتب رقم جوال صحيح';
  }
  return '';
}

const AUCTION_INCS = [5000, 10000, 25000];
let subs = [], ticker = null, curAuction = null, myEntry = null, bidInc = 0, entryDraft = null;
function cleanup(){ subs.forEach(u => { try{ u(); }catch(e){} }); subs = []; clearInterval(ticker); ticker = null; }
const sar = n => ar(n) + ' ر.س';
function alias(uid){ let h = 0; for(const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 'مزايد ' + ar(100 + h % 900).replace(/٬/g,''); }
const endMs = a => a.endAt?.toMillis ? a.endAt.toMillis() : 0;
const startMs = a => a.startAt?.toMillis ? a.startAt.toMillis() : 0;
function phase(a){
  const now = Date.now();
  if(a.status === 'closed' || now >= endMs(a)) return 'ended';
  if(startMs(a) && now < startMs(a)) return 'upcoming';
  return 'live';
}
function left(ms){
  if(ms <= 0) return 'انتهى';
  const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  const p = n => String(n).padStart(2,'0');
  return d ? `${d}ي ${p(h)}:${p(m)}` : `${p(h)}:${p(m)}:${p(x)}`;
}
const liveBadge = a => { const ph = phase(a); return ph === 'live' ? '<span class="live"><i></i>مباشر</span>' : ph === 'upcoming' ? '<span class="live soon">قريباً</span>' : '<span class="live off">انتهى</span>'; };

    <div id="alist" class="grid"><div class="empty" style="grid-column:1/-1">جارٍ التحميل…</div></div>`;
  try{
    const snap = await getDocs(query(collection(db,'auctions'), orderBy('endAt','desc'), limit(50)));
    const list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    const rank = a => ({ live:0, upcoming:1, ended:2 })[phase(a)];
    list.sort((a,b) => rank(a) - rank(b) || (rank(a) === 2 ? endMs(b) - endMs(a) : endMs(a) - endMs(b)));
    const el = document.getElementById('alist'); if(!el) return;
    el.innerHTML = list.length ? list.map(a => `
      <a class="card" href="#/auction/${a.id}">
        <div class="ph">${a.thumb ? `<img src="${a.thumb}" alt="" loading="lazy">` : 'لا توجد صورة'}${liveBadge(a)}</div>
        <div class="cb"><b>${esc(a.horseName)}</b><span class="meta">${esc([a.category, a.city].filter(Boolean).join('، '))}</span>
          <span class="meta">${a.bidCount ? 'أعلى مزايدة' : 'سعر الافتتاح'}</span>
          <span class="price">${sar(a.bidCount ? a.currentBid : a.startPrice)}</span>
          <span class="meta" data-end="${endMs(a)}" data-start="${startMs(a)}"></span></div></a>`).join('')
      : '<div class="empty" style="grid-column:1/-1">لا توجد مزادات حالياً.<br>تابعنا، تُعلن المزادات القادمة هنا.</div>';
    const tick = () => document.querySelectorAll('[data-end]').forEach(s => {
      const now = Date.now(), st = Number(s.dataset.start), en = Number(s.dataset.end);
      s.textContent = st && now < st ? 'يبدأ خلال ' + left(st - now) : now < en ? 'ينتهي خلال ' + left(en - now) : '';
    });
    tick(); ticker = setInterval(tick, 1000);
  }catch(e){ console.error(e); const el = document.getElementById('alist'); if(el) el.innerHTML = '<div class="empty" style="grid-column:1/-1">تعذّر تحميل المزادات.</div>'; }
}

    curAuction = { id, ...s.data() }; render();
  }, e => { console.error(e); app.innerHTML = '<div class="empty">تعذّر تحميل المزاد.</div>'; }));
  subs.push(onSnapshot(query(collection(db,'auctions',id,'bids'), orderBy('at','desc'), limit(15)), s => {
    bids = s.docs.map(d => d.data()); render();
  }, e => console.error(e)));
  if(user) subs.push(onSnapshot(doc(db,'auctions',id,'entries',user.uid), s => {
    myEntry = s.exists() ? s.data() : null; render();
  }, e => console.error(e)));
  if(isAdmin()) subs.push(onSnapshot(collection(db,'auctions',id,'entries'), s => {
    requests = s.docs.map(d => ({ uid:d.id, ...d.data() })).sort((a,b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1)); render();
  }, e => console.error(e)));
  ticker = setInterval(() => {
    const el = document.getElementById('clock'); if(!el || !curAuction) return;
    const ph = phase(curAuction), now = Date.now();
    el.textContent = ph === 'upcoming' ? left(startMs(curAuction) - now) : left(endMs(curAuction) - now);
    if(ph !== el.dataset.ph) render();
  }, 1000);
}

async function viewRequests(){
  if(!user){ app.innerHTML = loginPrompt('سجّل الدخول لعرض طلباتك.'); return; }
  app.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
  let sent = [], received = [], isProv = false;
  try{
    const [a, b, me] = await Promise.all([
      getDocs(query(collection(db,'serviceRequests'), where('requesterUid','==',user.uid))),
      getDocs(query(collection(db,'serviceRequests'), where('providerOwnerUid','==',user.uid))),
      getDoc(doc(db,'providers',user.uid))
    ]);
    const srt = x => x.docs.map(d => ({ id:d.id, ...d.data() })).sort((p,q) => (q.createdAt?.seconds||0) - (p.createdAt?.seconds||0));
    sent = srt(a); received = srt(b); isProv = me.exists();
  }catch(e){ console.error(e); app.innerHTML = '<div class="empty">تعذّر تحميل الطلبات.</div>'; return; }
  if(isProv && reqTab === 0 && !sent.length && received.length) reqTab = 1;
  const list = reqTab === 0 ? sent : received;
  const fmtDate = s => { try{ return new Date(s + 'T12:00').toLocaleDateString('ar-SA-u-ca-gregory', { weekday:'long', day:'numeric', month:'long' }); }catch(e){ return s; } };
  app.innerHTML = `<h1 class="h1">طلبات الخدمات</h1>
    ${isProv ? `<div class="tabs"><button class="${reqTab===0?'on':''}" data-act="reqTab" data-i="0">طلباتي (${ar(sent.length)})</button>
      <button class="${reqTab===1?'on':''}" data-act="reqTab" data-i="1">الواردة لخدمتي (${ar(received.filter(r => r.status==='new').length)} جديد)</button></div>` : ''}
    ${list.length ? list.map(r => `<div class="rq">
      <div class="rq-h"><b>${reqTab === 0 ? `<a href="#/service/${r.providerId}" style="color:inherit">${esc(r.providerName)}</a>` : esc(r.requesterName)}</b><span class="st ${r.status}">${RQ_ST[r.status]}</span></div>
      <span class="meta">${esc(svcOf(r.type).label)}${r.horse ? '، الخيل: ' + esc(r.horse) : ''}</span>
      <span>${fmtDate(r.date)}، ${esc(r.slot)}</span>
      ${r.location ? `<span class="meta">${esc(r.location)}</span>` : r.place === 'provider' ? '<span class="meta">عند مقدّم الخدمة</span>' : ''}
      ${r.notes ? `<span class="meta" style="white-space:pre-line">${esc(r.notes)}</span>` : ''}
      ${r.reply ? `<div class="note" style="margin:4px 0 0">ردّ مقدّم الخدمة: ${esc(r.reply)}</div>` : ''}
      ${reqTab === 1 ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
          <a class="btn sm" href="https://wa.me/${waNumber(r.phone)}" target="_blank" rel="noopener">${I.chat}واتساب</a>
          <a class="btn sm" href="tel:${esc(r.phone)}">${I.phone}اتصال</a>
          ${r.status === 'new' ? `<button class="btn sm primary" data-act="rqSet" data-id="${r.id}" data-s="accepted">قبول</button><button class="btn sm danger" data-act="rqSet" data-id="${r.id}" data-s="declined">اعتذار</button>` : ''}
          ${r.status === 'accepted' ? `<button class="btn sm outline" data-act="rqSet" data-id="${r.id}" data-s="done">تم التنفيذ</button>` : ''}</div>`
        : r.status === 'new' ? `<div><button class="btn sm danger" data-act="rqSet" data-id="${r.id}" data-s="cancelled">إلغاء الطلب</button></div>` : ''}
    </div>`).join('')
    : `<div class="empty">${reqTab === 0 ? 'لم ترسل أي طلب بعد.<br><br><a class="btn primary" href="#/services">تصفح الخدمات</a>' : 'لا توجد طلبات واردة بعد.'}</div>`}
    ${!isProv ? '<p class="meta" style="margin-top:16px">تقدّم خدمات للخيل؟ <a href="#/service/edit">سجّل خدمتك</a></p>' : ''}`;
}

    if(p.type === 'transport' && !d.location) return toast('اكتب من أين وإلى أين');
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    try{
      await addDoc(collection(db,'serviceRequests'), {
        providerId:p.id, providerOwnerUid:p.ownerUid, providerName:p.name, type:p.type,
        requesterUid:user.uid, requesterName:d.name, phone:digits(d.phone),

    }catch(e){ console.error(e); toast('تعذّر الإرسال (' + (e.code || 'خطأ') + ')'); btn.disabled = false; btn.textContent = 'إرسال الطلب'; }
  },
  reqTab: t => { reqTab = Number(t.dataset.i); viewRequests(); },
  rqSet: async t => {
    const s = t.dataset.s; let reply = null;
    if(s === 'accepted'){ reply = prompt('رسالة للعميل (اختياري): الموعد أو السعر', ''); if(reply === null) return; }

    try{ await updateDoc(doc(db,'serviceRequests',t.dataset.id), { status:s, ...(reply !== null ? { reply } : {}), updatedAt:serverTimestamp() }); toast('تم التحديث'); viewRequests(); }
    catch(e){ console.error(e); toast('تعذّر التحديث'); }
  },
  provApprove: async () => { try{ await updateDoc(doc(db,'providers',curProv.id), { status:'approved' }); toast('اعتُمدت الخدمة'); viewProvider(curProv.id); }catch(e){ toast('تعذّر التحديث'); } },
  provHide: async () => { if(!confirm('إخفاء هذه الخدمة من الدليل؟')) return; try{ await updateDoc(doc(db,'providers',curProv.id), { status:'pending' }); toast('أُخفيت الخدمة'); viewProvider(curProv.id); }catch(e){ toast('تعذّر التحديث'); } },
  provVerify: async () => { try{ await updateDoc(doc(db,'providers',curProv.id), { verified:!curProv.verified }); toast('تم التحديث'); viewProvider(curProv.id); }catch(e){ toast('تعذّر التحديث'); } },
  pickInc: t => { bidInc = Number(t.dataset.i); rerender(); },
  copyIban: async () => { try{ const b = await getBank(); await navigator.clipboard.writeText(b.iban.replace(/\s/g,'')); toast('نُسخ الآيبان'); }catch(e){ toast('انسخ الرقم يدوياً'); } },
  sendEntry: async btn => {
    collectEntry(); const d = entryDraft;
    if(!d.name) return toast('اكتب اسمك');
    if(digits(d.phone).length < 9) return toast('اكتب رقم جوال صحيح');
    if(!d.receipt) return toast('ارفع صورة إيصال التحويل');
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    try{
      await setDoc(doc(db,'auctions',curAuction.id,'entries',user.uid), { name:d.name, phone:digits(d.phone), receipt:d.receipt, status:'pending', at:serverTimestamp() });

  },
  bid: async btn => {
    const amount = Number(btn.dataset.amount), id = curAuction.id;
    if(!confirm(`تأكيد المزايدة بمبلغ ${sar(amount)}؟ المزايدة ملزمة ولا يمكن سحبها.`)) return;
    btn.disabled = true; btn.textContent = 'جارٍ تسجيل المزايدة…';
    try{
      await runTransaction(db, async tx => {
        const ref = doc(db,'auctions',id);
        const s = await tx.get(ref); const a = s.data();
        if(phase(a) !== 'live') throw new Error('ended');
        const min = a.bidCount ? a.currentBid + AUCTION_INCS[0] : a.startPrice;
        if(amount < min) throw new Error('outbid');
        tx.update(ref, { currentBid:amount, currentBidder:user.uid, bidCount:a.bidCount + 1, lastBidAt:serverTimestamp() });
        tx.set(doc(collection(db,'auctions',id,'bids')), { uid:user.uid, alias:alias(user.uid), amount, at:serverTimestamp() });
      });
      toast('سُجّلت مزايدتك');
    }catch(e){
      console.error(e);
      toast(e.message === 'outbid' ? 'سبقك مزايد آخر، اختر مبلغاً أعلى' : e.message === 'ended' ? 'انتهى المزاد' : 'تعذّرت المزايدة (' + (e.code || 'خطأ') + ')');
      rerender();
    }
  },
  approve: async t => { try{ await updateDoc(doc(db,'auctions',curAuction.id,'entries',t.dataset.uid), { status:'approved', reviewedAt:serverTimestamp() }); toast('قُبل الطلب'); }catch(e){ toast('تعذّر التحديث'); } },
  reject: async t => {
    const note = prompt('سبب الرفض (يظهر للمستخدم):', 'لم يصل المبلغ أو الإيصال غير واضح');
    if(note === null) return;
    try{ await updateDoc(doc(db,'auctions',curAuction.id,'entries',t.dataset.uid), { status:'rejected', note, reviewedAt:serverTimestamp() }); toast('رُفض الطلب'); }catch(e){ toast('تعذّر التحديث'); }
  },
  viewReceipt: t => { const w = window.open(); if(w){ w.document.write(`<img src="${t.src}" style="max-width:100%">`); } },
  closeAuction: async () => {
    if(!confirm('إنهاء المزاد الآن؟ لن يتمكن أحد من المزايدة بعدها.')) return;
    try{ await updateDoc(doc(db,'auctions',curAuction.id), { status:'closed', endAt:Timestamp.now() }); toast('انتهى المزاد'); }catch(e){ toast('تعذّر الإنهاء'); }
  },
  markSold: async () => { try{ await updateDoc(doc(db,'horses',curAuction.horseId), { status:'sold' }); horsesCache = null; toast('حُدّد الخيل كمباع'); }catch(e){ toast('تعذّر التحديث'); } },
  winnerInfo: async () => {
    try{ const s = await getDoc(doc(db,'auctions',curAuction.id,'entries',curAuction.currentBidder));
      const w = s.exists() ? s.data() : null;
      alert(w ? `الفائز: ${w.name}\nالجوال: ${w.phone}\nالمبلغ: ${sar(curAuction.currentBid)}` : 'لا توجد بيانات للفائز');
    }catch(e){ toast('تعذّر جلب البيانات'); }
  },
  createAuction: async btn => {
    const startPrice = Number(digits(document.getElementById('aStart').value));
    const from = new Date(document.getElementById('aFrom').value), to = new Date(document.getElementById('aTo').value);
    const liveUrl = document.getElementById('aLive').value.trim();
    if(!startPrice) return toast('اكتب سعر الافتتاح');
    if(isNaN(from) || isNaN(to) || to <= from) return toast('وقت النهاية يجب أن يكون بعد البداية');
    if(to <= new Date()) return toast('وقت النهاية في الماضي');
    if(liveUrl && !isUrl(liveUrl)) return toast('رابط البث يجب أن يبدأ بـ https://');
    btn.disabled = true; btn.textContent = 'جارٍ الإنشاء…';
    const h = current;
    try{
      const ref = await addDoc(collection(db,'auctions'), {
        horseId:h.id, horseName:h.name, thumb:h.thumb || '', category:h.category || '', city:h.city || '', sellerUid:h.ownerUid,
        startPrice, minIncrement:AUCTION_INCS[0], currentBid:0, currentBidder:'', bidCount:0,
        startAt:Timestamp.fromDate(from), endAt:Timestamp.fromDate(to), liveUrl, status:'scheduled', createdAt:serverTimestamp()
      });
      toast('أُنشئ المزاد'); location.hash = '#/auction/' + ref.id;
    }catch(e){ console.error(e); toast('تعذّر الإنشاء (' + (e.code || 'خطأ') + ')'); btn.disabled = false; btn.textContent = 'إنشاء المزاد'; }
  },
  saveBank: async () => {
    const data = { bankName:document.getElementById('bName').value.trim(), holder:document.getElementById('bHolder').value.trim(),
      iban:document.getElementById('bIban').value.trim().toUpperCase(), fee:Number(digits(document.getElementById('bFee').value)) || 200 };
    if(!data.bankName || !data.holder || data.iban.replace(/\s/g,'').length < 15) return toast('أكمل بيانات الحساب');
    try{ await setDoc(doc(db,'settings','bank'), data); toast('حُفظت البيانات'); location.hash = '#/auctions'; }catch(e){ toast('تعذّر الحفظ (' + (e.code || 'خطأ') + ')'); }
  },
  stab: t => { stableTab = Number(t.dataset.i); viewStable(currentStable.uid); },
  follow: async btn => {
    const s = currentStable; btn.disabled = true;
    const ref = doc(db,'stables',s.uid,'followers',user.uid);
    try{
      if(s.following){ await deleteDoc(ref); toast('ألغيت المتابعة'); }
      else{ await setDoc(ref, { at: serverTimestamp() }); toast('تتابع هذا المربط الآن'); }
      viewStable(s.uid);
    }catch(e){ console.error(e); btn.disabled = false; toast(s.name ? 'تعذّرت المتابعة' : 'هذا البائع لم يُنشئ صفحة مربط بعد'); }
  },
  verifyStable: async () => {
    try{ await updateDoc(doc(db,'stables',currentStable.uid), { verified: !currentStable.verified }); toast(currentStable.verified ? 'أُلغي التوثيق' : 'وُثّق المربط'); viewStable(currentStable.uid); }
    catch(e){ toast('تعذّر التحديث'); }
  },
  rmLogo: () => { collectStable(); stableDraft.logo = ''; renderStableEdit(); },
  saveStable: async btn => {
    collectStable();
    const d = stableDraft;
    if(!d.name) return toast('اكتب اسم المربط');
    if(!d.city) return toast('اختر المدينة');
    if(d.phone && digits(d.phone).length < 9) return toast('رقم الجوال غير صحيح');
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    try{
      const ref = doc(db,'stables',user.uid);
      const data = { name:d.name, city:d.city, bio:d.bio, logo:d.logo, ownerUid:user.uid, updatedAt:serverTimestamp() };
      if(d.exists) await updateDoc(ref, data);
      else await setDoc(ref, { ...data, verified:false, createdAt:serverTimestamp() });
      await setDoc(doc(db,'stableContacts',user.uid), { phone:digits(d.phone), whatsapp:digits(d.whatsapp) || digits(d.phone) });
      toast('حُفظت صفحة المربط');
      location.hash = '#/stable/' + user.uid;
    }catch(e){ console.error(e); toast('تعذّر الحفظ (' + (e.code || 'خطأ') + ')'); btn.disabled = false; btn.textContent = 'حفظ الصفحة'; }
  },
  soon: () => toast('قريباً في صهيل'),
  login: async () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try{ await signInWithPopup(auth, provider); toast('تم الدخول'); }
    catch(e){
      console.error(e);
      const c = e.code || '';
      if(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
      if(c === 'auth/popup-blocked'){ toast('جارٍ فتح صفحة الدخول…'); return signInWithRedirect(auth, provider); }
      const msg = {
        'auth/operation-not-allowed': 'الدخول بـ Google غير مفعّل في Firebase',
        'auth/unauthorized-domain': 'رابط الموقع غير مضاف في Authorized domains',
        'auth/network-request-failed': 'تحقق من الاتصال بالإنترنت',
        'auth/internal-error': 'خطأ داخلي، أغلق المتصفح وحاول مرة أخرى'
      }[c];
      toast((msg || 'تعذّر الدخول') + ' (' + (c || 'unknown') + ')');
    }
  },
  logout: async () => { await signOut(auth); draft = null; editingId = null; toast('تم الخروج'); location.hash = '#/'; },
  next: () => { collect(); const err = validate(step); if(err) return toast(err); step++; renderStep(); window.scrollTo(0,0); },
  prev: () => { collect(); step--; renderStep(); window.scrollTo(0,0); },
  rmPhoto: t => { collect(); draft.photos.splice(Number(t.dataset.i), 1); renderStep(); },
  cover: t => { collect(); const i = Number(t.dataset.i); const [p] = draft.photos.splice(i, 1); draft.photos.unshift(p); renderStep(); },
  share: async () => {
    const url = location.href;
    try{ const title = 'صهيل: ' + (location.hash.startsWith('#/stable') ? (currentStable?.name || 'صفحة مربط') : current?.name); if(navigator.share) await navigator.share({ title, url }); else { await navigator.clipboard.writeText(url); toast('نُسخ رابط الإعلان'); } }catch(e){}
  },
  publish: async btn => {
    collect();
    for(let s = 1; s <= 4; s++){ const err = validate(s); if(err){ step = s; renderStep(); toast(err); return; } }
    const d = draft;
    if(d.photos.reduce((a,p) => a + p.length, 0) > 950000){ step = 2; renderStep(); toast('حجم الصور كبير، احذف صورة أو أكثر'); return; }
    btn.disabled = true; btn.textContent = 'جارٍ النشر…';
    try{
      const thumb = await resize(d.photos[0], 420, 0.6);
      const data = {
        name:d.name, category:d.category, sex:d.sex, color:d.color, city:d.city, regNo:d.regNo,
        birthYear: d.birthYear ? Number(digits(d.birthYear)) : null,
        sire:d.sire, dam:d.dam, sireSire:d.sireSire, sireDam:d.sireDam, damSire:d.damSire, damDam:d.damDam,
        achievements:d.achievements, videoUrl:d.videoUrl, desc:d.desc,
        method:d.method, price: d.method === 'fixed' ? Number(digits(d.price)) : null,
        negotiable: d.method === 'fixed' && !!d.negotiable,
        sellerName: d.sellerName || user.displayName || '',
        thumb, updatedAt: serverTimestamp()
      };
      let id = editingId;
      if(id){
        await updateDoc(doc(db,'horses',id), data);
      }else{
        const ref = await addDoc(collection(db,'horses'), { ...data, ownerUid:user.uid, verified:false, status:'active', createdAt:serverTimestamp() });
        id = ref.id;
      }
      await setDoc(doc(db,'horsePhotos',id), { photos:d.photos });
      await setDoc(doc(db,'contacts',id), { phone:digits(d.phone), whatsapp:digits(d.whatsapp) || digits(d.phone) });
      const wasEdit = !!editingId;
      horsesCache = null; draft = null; editingId = null; step = 1;
      toast(wasEdit ? 'حُفظت التعديلات' : 'نُشر الإعلان');
      location.hash = '#/horse/' + id;
    }catch(e){
      console.error(e);
      toast('تعذّر النشر. تحقق من الاتصال وحاول مرة أخرى');
      btn.disabled = false; btn.textContent = editingId ? 'حفظ التعديلات' : 'نشر الإعلان';
    }
  },
  sold: async () => {
    try{ await updateDoc(doc(db,'horses',current.id), { status: current.status === 'sold' ? 'active' : 'sold' }); horsesCache = null; toast('تم التحديث'); viewHorse(current.id); }
    catch(e){ toast('تعذّر التحديث'); }
  },
  verify: async () => {
    try{ await updateDoc(doc(db,'horses',current.id), { verified: !current.verified }); horsesCache = null; toast(current.verified ? 'أُلغي التوثيق' : 'وُثّق الإعلان'); viewHorse(current.id); }
    catch(e){ toast('تعذّر التحديث'); }
  },
  del: async () => {
    if(!confirm('حذف الإعلان نهائياً؟ لا يمكن التراجع.')) return;
    const id = current.id;
    try{
      await deleteDoc(doc(db,'horsePhotos',id));
      await deleteDoc(doc(db,'contacts',id));
      await deleteDoc(doc(db,'horses',id));
      horsesCache = null; toast('حُذف الإعلان'); location.hash = '#/mine';
    }catch(e){ console.error(e); toast('تعذّر الحذف'); }
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-set],[data-act]');
  if(!t) return;
  if(t.dataset.cat){
    filter.cat = t.dataset.cat;
    document.querySelectorAll('.chip[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === filter.cat));
    renderGrid(); return;
  }
  if(t.dataset.set){ collect(); draft[t.dataset.set] = t.dataset.val; renderStep(); return; }
  const fn = actions[t.dataset.act];
  if(fn){ e.preventDefault(); fn(t); }
});
</script>
</body>
</html>
