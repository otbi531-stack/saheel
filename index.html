<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<title>صهيل — للخيول العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root{
  --bg:#FAF6EE; --card:#FFFFFF; --ink:#2A1A10; --muted:#6B5646; --line:#E8DDCB;
  --accent:#7A3E1D; --accent-d:#5A2C13; --gold:#F3E6C8; --gold-ink:#6B4A12;
  --ph:#E9DCC6; --ok-bg:#E3F0E4; --ok:#24552E; --red:#B4261A;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
:focus-visible{outline:3px solid #C9A055;outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{position:relative;display:inline-block;padding-bottom:26px;font-family:'Reem Kufi',serif;font-size:30px;font-weight:700;color:var(--accent);line-height:1.05;text-decoration:none}
.logo small{position:absolute;top:calc(100% - 22px);right:78%;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--red);border-color:#E9C3BE}
.btn.sm{height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.6}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted);margin-top:6px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;padding:0}
.chip{flex:none;height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.soon{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.soon button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-align:right;cursor:pointer}
.soon small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.h1{font-size:24px;font-weight:700;margin:6px 0 16px}
.h2{font-size:18px;font-weight:700;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink)}
.ph{position:relative;aspect-ratio:4/3;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;white-space:nowrap}
.ph .badge{position:absolute;top:8px;right:8px}
.badge.sold{background:var(--ink);color:#fff}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.cb b{font-size:16px}
.meta{font-size:12px;color:var(--muted)}
.price{font-size:14px;font-weight:700;color:var(--accent);margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:44px 10px;font-size:14px;line-height:1.8}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.hero{position:relative;margin:0 -16px 16px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--ph);scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center}
.hero .ph{aspect-ratio:4/3}
.fab{position:absolute;top:12px;width:44px;height:44px;border-radius:22px;border:0;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;box-shadow:0 1px 3px rgba(42,26,16,.18)}
.fab.r{right:16px}.fab.l{left:16px}
.pcount{position:absolute;bottom:12px;left:16px;background:rgba(42,26,16,.7);color:#fff;font-size:12px;padding:5px 10px;border-radius:12px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hd h1{margin:0;font-size:28px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:13px}
.loc{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:16px}
.pricebox{display:flex;flex-direction:column;gap:2px}
.pricebox b{font-size:22px;color:var(--accent)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec h2{margin:0;font-size:18px}
.ped{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ped .col{display:flex;flex-direction:column;gap:6px}
.ped .main{padding:12px;border-radius:12px;background:var(--accent);color:#fff}
.ped .main.f{background:var(--gold);color:var(--ink)}
.ped .main span{display:block;font-size:11px;opacity:.85}
.ped .main b{font-size:15px}
.ped .sub{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ped .sub div{padding:8px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;min-height:52px}
.ped .sub span{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.text{white-space:pre-line;font-size:14px;line-height:1.8;margin:0}
.seller{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;flex:none;border-radius:24px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Reem Kufi',serif;font-size:20px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;margin-bottom:16px}
.f .opt{font-weight:400;color:var(--muted);font-size:12px}
.in{width:100%;min-width:0;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;font-weight:400;color:var(--ink)}
textarea.in{height:auto;padding:12px 14px;line-height:1.6;resize:vertical}
.in::placeholder{color:#8A7766}
.seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px;padding:4px;border-radius:14px;background:#EFE5D4}
.seg button{height:42px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:#5E4A3B;cursor:pointer}
.seg button.on{background:#fff;color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:500;margin:-6px 0 12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 20px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.steps i{height:5px;border-radius:3px;background:var(--line)}
.steps .on i{background:var(--accent)}
.steps .cur{color:var(--ink);font-weight:700}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:140px;border:2px dashed #C9B596;border-radius:16px;background:#fff;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:12px;text-align:center}
.upload b{color:var(--ink);font-size:15px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--ph)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:17px;border:0;background:rgba(42,26,16,.7);color:#fff;font-size:18px;cursor:pointer}
.thumbs .cv{position:absolute;bottom:4px;right:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--gold);color:var(--gold-ink);border:0;cursor:pointer;font-family:inherit}
.note{padding:12px 14px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:13px;line-height:1.7;margin-bottom:16px}
.wact{display:flex;gap:10px;margin:8px 0 20px}
.wact .btn.primary{flex:1}
.mrow{display:flex;align-items:center;gap:12px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.mrow .ph{width:72px;height:72px;aspect-ratio:auto;flex:none;border-radius:10px}
.mrow .mi{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.actions .btn{flex:1 1 140px}
.admin{border:1.5px dashed #C9B596;background:#FFFDF8}
.st-head{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.st-logo{width:76px;height:76px;flex:none;border-radius:38px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Reem Kufi',serif;font-size:32px;font-weight:700;overflow:hidden}
.st-logo img{width:100%;height:100%;object-fit:cover}
.st-head h1{margin:0;font-size:24px;line-height:1.3}
.st-bio{font-size:14px;line-height:1.8;color:#4A3628;white-space:pre-line;margin:0 0 14px}
.st-btns{display:flex;gap:8px;margin-bottom:14px}
.st-btns .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stats div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stats b{font-size:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{height:46px;border:0;border-bottom:3px solid transparent;background:transparent;font:inherit;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:700}
.logo-up{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.mystable{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.mystable .mi{flex:1;min-width:0}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:500}
nav.bottom a.on{color:var(--accent);font-weight:700}
nav.bottom a.add{width:58px;height:58px;min-width:0;margin-top:-28px;border-radius:29px;background:var(--accent);color:#fff;border:4px solid var(--bg);justify-content:center}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ============ أدوات مساعدة ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar = n => Number(n).toLocaleString('ar-SA');
const toEn = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),5000); }

function ageText(h){
  if(!h.birthYear) return '';
  const y = new Date().getFullYear() - h.birthYear;
  if(y < 1) return 'أقل من سنة';
  if(y === 1) return 'سنة';
  if(y === 2) return 'سنتان';
  return ar(y) + (y <= 10 ? ' سنوات' : ' سنة');
}
function priceText(h){
  if(h.method === 'offers') return 'على السوم';
  return h.price ? ar(h.price) + ' ر.س' : 'السعر عند التواصل';
}
function waNumber(p){
  let d = digits(p);
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('05')) d = '966' + d.slice(1);
  else if(d.length === 9 && d.startsWith('5')) d = '966' + d;
  return d;
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function resize(src, max, q){
  const img = await loadImg(src);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

function route(){
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);

async function viewAdd(id){
  if(!user){ app.innerHTML = loginPrompt('سجّل الدخول لإضافة إعلان خيل.'); return; }
  if(id){
    if(editingId !== id){
      app.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
      try{
        const [s,p,c] = await Promise.all([getDoc(doc(db,'horses',id)), getDoc(doc(db,'horsePhotos',id)), getDoc(doc(db,'contacts',id))]);
        if(!s.exists() || (s.data().ownerUid !== user.uid && !isAdmin())){ app.innerHTML = '<div class="empty">لا يمكنك تعديل هذا الإعلان.</div>'; return; }
        const h = s.data();
        draft = { ...emptyDraft(), ...h,
          birthYear: h.birthYear ? String(h.birthYear) : '', price: h.price != null ? String(h.price) : '',
          photos: p.exists() ? (p.data().photos || []) : [],
          phone: c.exists() ? c.data().phone : '', whatsapp: c.exists() ? c.data().whatsapp : '' };
        editingId = id; step = 1;
      }catch(e){ console.error(e); app.innerHTML = '<div class="empty">تعذّر تحميل الإعلان للتعديل.</div>'; return; }
    }
  }else if(editingId || !draft){
    draft = emptyDraft(); editingId = null; step = 1;
  }
  renderStep();
}

    body = `

      <div class="two">${field('أبو الأب','sireSire','')}${field('أم الأب','sireDam','')}</div>
      <div class="two">${field('أبو الأم','damSire','')}${field('أم الأم','damDam','')}</div>

      <div class="two">

                 : `<button class="btn primary" data-act="publish">${editingId ? 'حفظ التعديلات' : 'نشر الإعلان'}</button>`}
    </div>`;

async function onFiles(e){
  collect();
  const files = [...e.target.files];
  const room = MAX_PHOTOS - draft.photos.length;
  if(room <= 0){ toast(`الحد الأقصى ${ar(MAX_PHOTOS)} صور`); return; }
  if(files.length > room) toast(`أُضيفت أول ${ar(room)} صور فقط`);
  else toast('جارٍ تجهيز الصور…');
  for(const f of files.slice(0, room)){
    try{ const url = URL.createObjectURL(f); draft.photos.push(await resize(url, 900, 0.65)); URL.revokeObjectURL(url); }
    catch(err){ toast('تعذّرت قراءة إحدى الصور، جرّب صورة بصيغة JPG'); }
  }
  renderStep();
}

function validate(s){
  const d = draft;
  if(s === 1){
    if(!d.name) return 'اكتب اسم الخيل';
    if(!d.city) return 'اختر المدينة';
    if(d.birthYear){ const y = Number(digits(d.birthYear)); if(y < 1990 || y > new Date().getFullYear()) return 'سنة الميلاد غير صحيحة'; }
  }
  if(s === 2){
    if(!d.photos.length) return 'أضف صورة واحدة على الأقل';
    if(d.videoUrl && !isUrl(d.videoUrl)) return 'رابط الفيديو يجب أن يبدأ بـ https://';
  }
  if(s === 4){
    if(d.method === 'fixed' && !Number(digits(d.price))) return 'اكتب السعر أو اختر «على السوم»';
    if(digits(d.phone).length < 9) return 'اكتب رقم جوال صحيح';
  }
  return '';
}

      </div>`).join('')
      : '<div class="empty">لم تضف أي إعلان بعد.<br><br><a class="btn primary" href="#/add">أضف أول إعلان</a></div>';
  }catch(e){ console.error(e); const el=document.getElementById('mine'); if(el) el.innerHTML = '<div class="empty">تعذّر تحميل إعلاناتك.</div>'; }
}

/* ============ صفحة المربط ============ */
let stableTab = 0, currentStable = null, stableDraft = null;

async function viewStable(uid){
  if(!uid){ location.hash = '#/'; return; }
  app.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
  let s = null, horses = [], followers = 0, following = false, contact = null;
  try{
    const [sd, hs, fc, mf, ct] = await Promise.all([
      getDoc(doc(db,'stables',uid)),
      getDocs(query(collection(db,'horses'), where('ownerUid','==',uid))),
      getCountFromServer(collection(db,'stables',uid,'followers')).catch(() => null),
      user ? getDoc(doc(db,'stables',uid,'followers',user.uid)).catch(() => null) : Promise.resolve(null),
      user ? getDoc(doc(db,'stableContacts',uid)).catch(() => null) : Promise.resolve(null)
    ]);
    if(sd.exists()) s = sd.data();
    horses = hs.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    followers = fc ? fc.data().count : 0;
    following = !!(mf && mf.exists());
    if(ct && ct.exists()) contact = ct.data();
  }catch(e){ console.error(e); app.innerHTML = '<div class="empty">تعذّر تحميل صفحة المربط.</div>'; return; }

  const own = user && user.uid === uid;
  if(!s && !horses.length){
    app.innerHTML = own
      ? '<div class="empty">لم تُنشئ صفحة مربطك بعد.<br><br><a class="btn primary" href="#/stable/edit">أنشئ صفحة المربط</a></div>'
      : '<div class="empty">هذه الصفحة غير موجودة.<br><br><a class="btn" href="#/">العودة للرئيسية</a></div>';
    return;
  }
  currentStable = { uid, ...(s || {}), followers, following };
  const name = s?.name || horses[0]?.sellerName || 'بائع على صهيل';
  const active = horses.filter(h => h.status !== 'sold');
  const sold = horses.filter(h => h.status === 'sold');
  const list = stableTab === 0 ? active : sold;
  const since = s?.createdAt?.seconds ? new Date(s.createdAt.seconds * 1000).getFullYear() : null;
  const wa = contact && (contact.whatsapp || contact.phone);

  app.innerHTML = `
    <div class="st-head">
      <span class="st-logo">${s?.logo ? `<img src="${s.logo}" alt="شعار ${esc(name)}">` : esc(name.trim()[0])}</span>
      <div style="min-width:0">
        <h1>${esc(name)}</h1>
        ${s?.verified ? `<span class="badge">${I.check}مربط موثّق</span>` : ''}
        <div class="loc" style="margin:6px 0 0">${I.pin}${esc(s?.city || horses[0]?.city || '')}${since ? `، عضو منذ ${ar(since).replace(/٬/g,'')}` : ''}</div>
      </div>
    </div>
    ${s?.bio ? `<p class="st-bio">${esc(s.bio)}</p>` : ''}

    <div class="st-btns">${
      own ? '<a class="btn outline" href="#/stable/edit">تعديل صفحتي</a><button class="btn" data-act="share">مشاركة</button>'
      : !user ? '<button class="btn primary" data-act="login">ادخل للمتابعة والتواصل</button>'
      : `<button class="btn ${following ? 'outline' : 'primary'}" data-act="follow">${following ? 'تتابعه' : 'متابعة'}</button>
         ${wa ? `<a class="btn" href="https://wa.me/${waNumber(wa)}?text=${encodeURIComponent('السلام عليكم، وصلت لصفحتكم عبر صهيل')}" target="_blank" rel="noopener">${I.chat}واتساب</a>
         <a class="btn" style="flex:0 0 52px;padding:0" href="tel:${esc(digits(contact.phone))}" aria-label="اتصال">${I.phone}</a>` : ''}`
    }</div>

    <div class="stats">
      <div><b>${ar(active.length)}</b><span class="meta">معروضة</span></div>
      <div><b>${ar(followers)}</b><span class="meta">متابع</span></div>
      <div><b>${ar(sold.length)}</b><span class="meta">مباعة</span></div>
    </div>

    <div class="tabs" role="tablist">
      <button role="tab" class="${stableTab===0?'on':''}" data-act="stab" data-i="0">الخيول المعروضة</button>
      <button role="tab" class="${stableTab===1?'on':''}" data-act="stab" data-i="1">المباعة</button>
    </div>
    <div class="grid">${list.length ? list.map(card).join('')
      : `<div class="empty" style="grid-column:1/-1">${stableTab===0 ? 'لا توجد خيول معروضة حالياً.' : 'لا توجد خيول مباعة بعد.'}${own && stableTab===0 ? '<br><br><a class="btn primary" href="#/add">أضف إعلاناً</a>' : ''}</div>`}</div>

    ${isAdmin() && s ? `<div class="box admin" style="margin-top:20px"><b>أدوات المشرف</b>
      <div class="actions" style="margin:10px 0 0"><button class="btn outline" data-act="verifyStable">${s.verified ? 'إلغاء توثيق المربط' : 'توثيق المربط'}</button></div></div>` : ''}
  `;
}

async function viewStableEdit(){
  if(!user){ app.innerHTML = loginPrompt('سجّل الدخول لتعديل صفحة مربطك.'); return; }
  app.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
  try{
    const [sd, ct] = await Promise.all([getDoc(doc(db,'stables',user.uid)), getDoc(doc(db,'stableContacts',user.uid))]);
    const s = sd.exists() ? sd.data() : {};
    const c = ct.exists() ? ct.data() : {};
    stableDraft = { exists: sd.exists(), name: s.name || user.displayName || '', city: s.city || '', bio: s.bio || '', logo: s.logo || '',
      phone: c.phone || '', whatsapp: c.whatsapp && c.whatsapp !== c.phone ? c.whatsapp : '' };
  }catch(e){ console.error(e); app.innerHTML = '<div class="empty">تعذّر تحميل بيانات المربط.</div>'; return; }
  renderStableEdit();
}
function renderStableEdit(){
  const d = stableDraft;
  const f = (label, k, ph, extra='') => `<label class="f">${label}<input class="in" data-sf="${k}" value="${esc(d[k])}" placeholder="${ph}" ${extra}></label>`;
  app.innerHTML = `
    <h1 class="h1">${d.exists ? 'تعديل صفحة المربط' : 'إنشاء صفحة المربط'}</h1>
    <div class="logo-up">
      <span class="st-logo" id="logoPrev">${d.logo ? `<img src="${d.logo}" alt="">` : esc((d.name || 'م').trim()[0])}</span>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label class="btn sm outline" style="cursor:pointer">${d.logo ? 'تغيير الشعار' : 'أضف شعار المربط'}<input id="logoFile" type="file" accept="image/*" hidden></label>
        ${d.logo ? '<button class="btn sm danger" data-act="rmLogo">حذف الشعار</button>' : ''}
      </div>
    </div>
    ${f('اسم المربط','name','مثال: مربط الأصايل','maxlength="50"')}
    <label class="f">المدينة<select class="in" data-sf="city"><option value="">اختر المدينة</option>${opt(CITIES, d.city)}</select></label>
    <label class="f">نبذة عن المربط <span class="opt">(تاريخه، السلالات، أبرز الإنتاج)</span>
      <textarea class="in" rows="4" data-sf="bio" maxlength="600">${esc(d.bio)}</textarea></label>
    <div class="two">
      ${f('رقم الجوال','phone','05xxxxxxxx','inputmode="tel" dir="ltr"')}
      ${f('واتساب <span class="opt">(إن اختلف)</span>','whatsapp','05xxxxxxxx','inputmode="tel" dir="ltr"')}
    </div>
    <p class="meta" style="margin:-6px 0 16px">الرقم يظهر فقط للمستخدمين المسجّلين.</p>
    <div class="wact"><a class="btn" href="#/mine">إلغاء</a><button class="btn primary" data-act="saveStable">حفظ الصفحة</button></div>`;
  document.getElementById('logoFile').addEventListener('change', async e => {
    collectStable();
    const file = e.target.files[0]; if(!file) return;
    try{ const url = URL.createObjectURL(file); stableDraft.logo = await resize(url, 320, 0.75); URL.revokeObjectURL(url); renderStableEdit(); }
    catch(err){ toast('تعذّرت قراءة الصورة، جرّب صورة بصيغة JPG'); }
  });
}
function collectStable(){ app.querySelectorAll('[data-sf]').forEach(el => { stableDraft[el.dataset.sf] = el.value.trim(); }); }

/* ============ الأزرار ============ */
const actions = {
  stab: t => { stableTab = Number(t.dataset.i); viewStable(currentStable.uid); },
  follow: async btn => {
    const s = currentStable; btn.disabled = true;
    const ref = doc(db,'stables',s.uid,'followers',user.uid);
    try{
      if(s.following){ await deleteDoc(ref); toast('ألغيت المتابعة'); }
      else{ await setDoc(ref, { at: serverTimestamp() }); toast('تتابع هذا المربط الآن'); }
      viewStable(s.uid);
    }catch(e){ console.error(e); btn.disabled = false; toast(s.name ? 'تعذّرت المتابعة' : 'هذا البائع لم يُنشئ صفحة مربط بعد'); }
  },
  verifyStable: async () => {
    try{ await updateDoc(doc(db,'stables',currentStable.uid), { verified: !currentStable.verified }); toast(currentStable.verified ? 'أُلغي التوثيق' : 'وُثّق المربط'); viewStable(currentStable.uid); }
    catch(e){ toast('تعذّر التحديث'); }
  },
  rmLogo: () => { collectStable(); stableDraft.logo = ''; renderStableEdit(); },
  saveStable: async btn => {
    collectStable();
    const d = stableDraft;
    if(!d.name) return toast('اكتب اسم المربط');
    if(!d.city) return toast('اختر المدينة');
    if(d.phone && digits(d.phone).length < 9) return toast('رقم الجوال غير صحيح');
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    try{
      const ref = doc(db,'stables',user.uid);
      const data = { name:d.name, city:d.city, bio:d.bio, logo:d.logo, ownerUid:user.uid, updatedAt:serverTimestamp() };
      if(d.exists) await updateDoc(ref, data);
      else await setDoc(ref, { ...data, verified:false, createdAt:serverTimestamp() });
      await setDoc(doc(db,'stableContacts',user.uid), { phone:digits(d.phone), whatsapp:digits(d.whatsapp) || digits(d.phone) });
      toast('حُفظت صفحة المربط');
      location.hash = '#/stable/' + user.uid;
    }catch(e){ console.error(e); toast('تعذّر الحفظ (' + (e.code || 'خطأ') + ')'); btn.disabled = false; btn.textContent = 'حفظ الصفحة'; }
  },
  soon: () => toast('قريباً في صهيل'),
  login: async () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try{ await signInWithPopup(auth, provider); toast('تم الدخول'); }
    catch(e){
      console.error(e);
      const c = e.code || '';
      if(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
      if(c === 'auth/popup-blocked'){ toast('جارٍ فتح صفحة الدخول…'); return signInWithRedirect(auth, provider); }
      const msg = {
        'auth/operation-not-allowed': 'الدخول بـ Google غير مفعّل في Firebase',
        'auth/unauthorized-domain': 'رابط الموقع غير مضاف في Authorized domains',
        'auth/network-request-failed': 'تحقق من الاتصال بالإنترنت',
        'auth/internal-error': 'خطأ داخلي، أغلق المتصفح وحاول مرة أخرى'
      }[c];
      toast((msg || 'تعذّر الدخول') + ' (' + (c || 'unknown') + ')');
    }
  },
  logout: async () => { await signOut(auth); draft = null; editingId = null; toast('تم الخروج'); location.hash = '#/'; },
  next: () => { collect(); const err = validate(step); if(err) return toast(err); step++; renderStep(); window.scrollTo(0,0); },
  prev: () => { collect(); step--; renderStep(); window.scrollTo(0,0); },
  rmPhoto: t => { collect(); draft.photos.splice(Number(t.dataset.i), 1); renderStep(); },
  cover: t => { collect(); const i = Number(t.dataset.i); const [p] = draft.photos.splice(i, 1); draft.photos.unshift(p); renderStep(); },
  share: async () => {
    const url = location.href;
    try{ const title = 'صهيل: ' + (location.hash.startsWith('#/stable') ? (currentStable?.name || 'صفحة مربط') : current?.name); if(navigator.share) await navigator.share({ title, url }); else { await navigator.clipboard.writeText(url); toast('نُسخ رابط الإعلان'); } }catch(e){}
  },
  publish: async btn => {
    collect();
    for(let s = 1; s <= 4; s++){ const err = validate(s); if(err){ step = s; renderStep(); toast(err); return; } }
    const d = draft;
    if(d.photos.reduce((a,p) => a + p.length, 0) > 950000){ step = 2; renderStep(); toast('حجم الصور كبير، احذف صورة أو أكثر'); return; }
    btn.disabled = true; btn.textContent = 'جارٍ النشر…';
    try{
      const thumb = await resize(d.photos[0], 420, 0.6);
      const data = {
        name:d.name, category:d.category, sex:d.sex, color:d.color, city:d.city, regNo:d.regNo,
        birthYear: d.birthYear ? Number(digits(d.birthYear)) : null,
        sire:d.sire, dam:d.dam, sireSire:d.sireSire, sireDam:d.sireDam, damSire:d.damSire, damDam:d.damDam,
        achievements:d.achievements, videoUrl:d.videoUrl, desc:d.desc,
        method:d.method, price: d.method === 'fixed' ? Number(digits(d.price)) : null,
        negotiable: d.method === 'fixed' && !!d.negotiable,
        sellerName: d.sellerName || user.displayName || '',
        thumb, updatedAt: serverTimestamp()
      };
      let id = editingId;
      if(id){
        await updateDoc(doc(db,'horses',id), data);
      }else{
        const ref = await addDoc(collection(db,'horses'), { ...data, ownerUid:user.uid, verified:false, status:'active', createdAt:serverTimestamp() });
        id = ref.id;
      }
      await setDoc(doc(db,'horsePhotos',id), { photos:d.photos });
      await setDoc(doc(db,'contacts',id), { phone:digits(d.phone), whatsapp:digits(d.whatsapp) || digits(d.phone) });
      const wasEdit = !!editingId;
      horsesCache = null; draft = null; editingId = null; step = 1;
      toast(wasEdit ? 'حُفظت التعديلات' : 'نُشر الإعلان');
      location.hash = '#/horse/' + id;
    }catch(e){
      console.error(e);
      toast('تعذّر النشر. تحقق من الاتصال وحاول مرة أخرى');
      btn.disabled = false; btn.textContent = editingId ? 'حفظ التعديلات' : 'نشر الإعلان';
    }
  },
  sold: async () => {
    try{ await updateDoc(doc(db,'horses',current.id), { status: current.status === 'sold' ? 'active' : 'sold' }); horsesCache = null; toast('تم التحديث'); viewHorse(current.id); }
    catch(e){ toast('تعذّر التحديث'); }
  },
  verify: async () => {
    try{ await updateDoc(doc(db,'horses',current.id), { verified: !current.verified }); horsesCache = null; toast(current.verified ? 'أُلغي التوثيق' : 'وُثّق الإعلان'); viewHorse(current.id); }
    catch(e){ toast('تعذّر التحديث'); }
  },
  del: async () => {
    if(!confirm('حذف الإعلان نهائياً؟ لا يمكن التراجع.')) return;
    const id = current.id;
    try{
      await deleteDoc(doc(db,'horsePhotos',id));
      await deleteDoc(doc(db,'contacts',id));
      await deleteDoc(doc(db,'horses',id));
      horsesCache = null; toast('حُذف الإعلان'); location.hash = '#/mine';
    }catch(e){ console.error(e); toast('تعذّر الحذف'); }
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-set],[data-act]');
  if(!t) return;
  if(t.dataset.cat){
    filter.cat = t.dataset.cat;
    document.querySelectorAll('.chip[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === filter.cat));
    renderGrid(); return;
  }
  if(t.dataset.set){ collect(); draft[t.dataset.set] = t.dataset.val; renderStep(); return; }
  const fn = actions[t.dataset.act];
  if(fn){ e.preventDefault(); fn(t); }
});
</script>
</body>
</html>
